name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test and Lint
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, product-service, order-service, payment-service, notification-service]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      if: matrix.service != 'order-service' && matrix.service != 'payment-service'
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: services/${{ matrix.service }}/package-lock.json
    
    - name: Set up Go
      if: matrix.service == 'order-service'
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Set up Python
      if: matrix.service == 'payment-service'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies (Node.js)
      if: matrix.service != 'order-service' && matrix.service != 'payment-service'
      run: |
        cd services/${{ matrix.service }}
        npm ci
    
    - name: Run tests (Node.js)
      if: matrix.service != 'order-service' && matrix.service != 'payment-service'
      run: |
        cd services/${{ matrix.service }}
        npm test
    
    - name: Run linter (Node.js)
      if: matrix.service != 'order-service' && matrix.service != 'payment-service'
      run: |
        cd services/${{ matrix.service }}
        npm run lint
    
    - name: Run Go tests
      if: matrix.service == 'order-service'
      run: |
        cd services/${{ matrix.service }}
        go test ./... -v
    
    - name: Run Python tests
      if: matrix.service == 'payment-service'
      run: |
        cd services/${{ matrix.service }}
        pip install -r requirements.txt
        pytest

  # Security Scan
  security-scan:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Build and Push Docker Images
  build-and-push:
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, product-service, order-service, payment-service, notification-service]
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=sha,format=long
          type=raw,value=latest
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./services/${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}

  # Deploy to Kubernetes
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Set up Kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
    
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f infrastructure/kubernetes/deployment.yaml
        kubectl apply -f infrastructure/kubernetes/services.yaml
        kubectl apply -f infrastructure/kubernetes/ingress.yaml
        
        # Restart deployments to pick up new images
        kubectl rollout restart deployment/api-gateway
        kubectl rollout restart deployment/auth-service
        kubectl rollout restart deployment/product-service
        kubectl rollout restart deployment/order-service
        kubectl rollout restart deployment/payment-service
        kubectl rollout restart deployment/notification-service
        
        # Check rollout status
        kubectl rollout status deployment/api-gateway --timeout=5m
        kubectl rollout status deployment/auth-service --timeout=5m
    
    - name: Run smoke tests
      run: |
        # Add your smoke test commands here
        curl -f https://api.yourdomain.com/health || exit 1

  # Notifications
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify Slack on success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: 'Deployment completed successfully!'
        fields: repo,commit,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
    
    - name: Notify Slack on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: 'Deployment failed!'
        fields: repo,commit,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}